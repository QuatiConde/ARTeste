<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TesteAR2Git</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>

    <!-- TELA INICIAL -->
    <div id="startScreen" style="
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      z-index: 9999;
      color: white;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
    ">
      <div style="font-size: 48px; font-weight: bold;">Salão dos Monstros</div>
      <div style="font-size: 18px; opacity: 0.8;">Victor Almeida – Estúdio Aruanã</div>
      <button id="startBtn" style="
        font-size: 22px;
        padding: 15px 25px;
        border-radius: 10px;
        border: none;
        background: white;
        color: black;
        cursor: pointer;
        font-weight: bold;
      ">Iniciar Jogo</button>
    </div>

    <!-- UNITY WEBGL (FALTAVA ISSO!) -->
    <div id="unity-container" style="display:none;">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Museu.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Museu.data",
        frameworkUrl: buildUrl + "/Museu.framework.js",
        codeUrl: buildUrl + "/Museu.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TesteAR2Git",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      // Clique no botão inicia tudo
      document.getElementById("startBtn").addEventListener("click", function () {

        // Pede permissão para sensores
        if (typeof RequestGyroPermission === "function") {
          RequestGyroPermission();
        }

        // Esconde a tela inicial inteira
        document.getElementById("startScreen").style.display = "none";

        // Mostra o container do Unity
        container.style.display = "block";
        loadingBar.style.display = "block";

        // Carrega o Unity
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            console.log("Unity iniciado");
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      });
    </script>

  </body>
</html>
