<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TesteAR2Git</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
    }

    #menu-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;      /* Centraliza horizontal */
      justify-content: center;  /* Centraliza vertical */
      gap: 20px;                /* Espaço entre os elementos */
      background: #000;
    }

    .game-title {
      font-size: 56px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0;
    }

    .credits {
      font-size: 20px;
      opacity: 0.85;
      margin: 0;
    }


    .start-button {
      background: white;
      color: black;
      padding: 18px 40px;
      font-size: 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    .start-button:hover {
      background: #e6e6e6;
      transform: scale(1.05);
    }

    /* Unity começa escondido */
    #unity-container {
      display: none;
    }
  </style>

  <!-- TELA INICIAL -->
  <div id="menu-container">
    <div class="game-title">Salão dos Monstros</div>
    <div class="credits">Victor Almeida - Estúdio Aruanã</div>
    <button class="start-button" onclick="startGame()">Iniciar Jogo</button>
  </div>

  <!-- UNITY WEBGL -->
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ARTeste.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/ARTeste.data",
      frameworkUrl: buildUrl + "/ARTeste.framework.js",
      codeUrl: buildUrl + "/ARTeste.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TesteAR2Git",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    var unityInstance = null;

    function startGame() {
      // some o menu
      document.getElementById("menu-container").style.display = "none";
      // mostra o container do Unity
      document.getElementById("unity-container").style.display = "block";

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
