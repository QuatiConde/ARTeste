<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Jogo de Tiro | Unity WebAR</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Tela inicial */
    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 9999;
    }

    #startScreen h1 {
      font-size: 42px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #startScreen p {
      font-size: 18px;
      max-width: 300px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    /* Botão estiloso */
    #startBtn {
      font-size: 22px;
      padding: 15px 35px;
      border-radius: 12px;
      border: 2px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    #startBtn:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <!-- Tela inicial -->
  <div id="startScreen">
    <h1>Jogo de Tiro</h1>
    <p>Como jogar:<br>Use o celular para mirar e toque na tela para atirar.</p>
    <button id="startBtn">Iniciar</button>
  </div>

  <!-- Container Unity -->
  <div id="unity-container" style="display:none;">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ARTeste.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/ARTeste.data",
      frameworkUrl: buildUrl + "/ARTeste.framework.js",
      codeUrl: buildUrl + "/ARTeste.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TesteAR2Git",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    // Clique no botão inicia tudo
    document.getElementById("startBtn").addEventListener("click", function () {

      // Pede permissão para sensores (iOS)
      if (typeof RequestGyroPermission === "function") {
        RequestGyroPermission();
      }

      // Esconde a tela inicial
      document.getElementById("startScreen").style.display = "none";

      // Mostra o container do Unity
      container.style.display = "block";
      loadingBar.style.display = "block";

      // Carrega o Unity
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          console.log("Unity iniciado");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    });
  </script>

</body>
</html>
